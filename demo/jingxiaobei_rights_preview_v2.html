<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>京小贝权益大卡系统交互泳道图</title>
  <style>
    :root { --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --ink: #1b1f24; --muted: #6b7280; --accent: #2f6feb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; font-size: 13px; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; min-height: 50px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .identity { grid-column: 1; display: flex; align-items: baseline; gap: 12px; min-width: 0; overflow: hidden; }
    h1 { flex: 0 1 auto; min-width: 0; overflow: hidden; margin: 0; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .filename { flex: 0 1 auto; min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .toolbar, .tool-group { display: flex; align-items: center; gap: 6px; }
    #previewTools { grid-column: 2; justify-self: center; }
    .toolbar { grid-column: 3; justify-self: end; }
    button { min-height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); font: inherit; white-space: nowrap; cursor: pointer; transition: background .12s, border-color .12s; }
    button:hover { background: #f0f2f5; border-color: #d3d8df; }
    button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    button.primary:hover { background: #2560d4; border-color: #2560d4; }
    button:disabled { opacity: .55; cursor: wait; }
    #zoomLabel { width: 46px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
    #workspace { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background-color: var(--bg); background-image: radial-gradient(#dfe3e9 1px, transparent 1px); background-size: 20px 20px; }
    #stage.dragging { cursor: grabbing; }
    #viewport { position: absolute; inset: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
    #diagram { display: block; width: 1662px; height: 2292px; max-width: none; background: #ffffff; pointer-events: none; user-select: none; }
    #editor { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #ffffff; }
    .hint { position: absolute; left: 14px; bottom: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.9); color: var(--muted); pointer-events: none; }
    .notes { position: absolute; right: 14px; bottom: 14px; width: min(460px, calc(100% - 28px)); max-height: min(55vh, 370px); overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
    .notes summary { padding: 5px 10px; font-weight: 600; cursor: pointer; }
    .notes[open] summary { border-bottom: 1px solid var(--line); }
    .notes p { margin: 9px 10px; line-height: 1.55; }
    footer { min-height: 32px; padding: 6px 14px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); }
    #toast { position: fixed; left: 50%; bottom: 48px; z-index: 10; padding: 7px 12px; border-radius: 7px; background: var(--ink); color: #ffffff; opacity: 0; transform: translate(-50%, 8px); transition: opacity .15s, transform .15s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(27,31,36,.36); }
    .dialog-card { width: min(440px, 100%); padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: 0 18px 48px rgba(27,31,36,.16); }
    .dialog-card h2 { margin: 0 0 8px; font-size: 16px; }
    .dialog-card p { margin: 0; color: var(--muted); line-height: 1.6; }
    .dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    @media (max-width: 760px) {
      header { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; overflow-y: hidden; }
      .identity { flex: 1 1 0; gap: 0; }
      .filename { display: none; }
      #previewTools, .toolbar { flex: 0 0 auto; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="identity">
      <h1>京小贝权益大卡与金条卡片交互</h1>
      <span class="filename">jingxiaobei_rights.drawio</span>
    </div>
    <div id="previewTools" class="tool-group" aria-label="预览缩放">
      <button id="zoomOut" type="button" title="缩小" aria-label="缩小">−</button>
      <span id="zoomLabel" aria-live="off">100%</span>
      <button id="zoomIn" type="button" title="放大" aria-label="放大">+</button>
      <button id="fit" type="button">适应</button>
    </div>
    <div class="toolbar">
      <button id="openEditor" type="button">编辑</button>
      <button id="returnPreview" type="button" hidden>预览</button>
      <button id="download" class="primary" type="button">下载</button>
    </div>
  </header>
  <main id="workspace">
    <div id="stage" aria-label="京小贝系统交互泳道图 SVG 预览">
      <div id="viewport"><img id="diagram" src="./jingxiaobei_rights_preview.svg" alt="用户、京小贝前端、京小贝服务端、金条服务端的竖向系统交互泳道图" draggable="false"></div>
      <div class="hint">拖拽平移 · 滚轮缩放 · 双击适应窗口</div>
    </div>
    <iframe id="editor" title="draw.io 编辑画布" hidden></iframe>
    <details id="notes" class="notes">
      <summary>本次建图的假设与待确认项</summary>
      <p>假设：进入对话页后由前端触发权益大卡加载；OPE 配置作为金条服务端查询素材的一部分；已激活与未激活人群在识别后进入同一权益处理流程。</p>
      <p>待确认：query 的接收方与返回过程，以及借款/激活卡片的拉起方式。图中仅表达前端发起 query 后按权益信息选择对应卡片。</p>
    </details>
  </main>
  <footer><span id="status" role="status">SVG 预览已就绪</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="returnDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="returnDialogTitle" hidden>
    <div class="dialog-card">
      <h2 id="returnDialogTitle">如何处理刚才的修改？</h2>
      <p>应用修改则会更新页面预览；如需将图保存在本地，请点击“下载”。</p>
      <div class="dialog-actions">
        <button id="continueEditing" type="button">继续编辑</button>
        <button id="discardChanges" type="button">放弃修改并返回</button>
        <button id="applyChanges" class="primary" type="button">应用修改并返回</button>
      </div>
    </div>
  </div>
  <script src="./jingxiaobei_rights_data.js"></script>
  <script>
    (() => {
      const stage = document.querySelector('#stage');
      const viewport = document.querySelector('#viewport');
      const diagram = document.querySelector('#diagram');
      const editor = document.querySelector('#editor');
      const notes = document.querySelector('#notes');
      const status = document.querySelector('#status');
      const toast = document.querySelector('#toast');
      const zoomLabel = document.querySelector('#zoomLabel');
      const openButton = document.querySelector('#openEditor');
      const returnButton = document.querySelector('#returnPreview');
      const downloadButton = document.querySelector('#download');
      const previewTools = document.querySelector('#previewTools');
      const returnDialog = document.querySelector('#returnDialog');
      const applyButton = document.querySelector('#applyChanges');
      const discardButton = document.querySelector('#discardChanges');
      const continueButton = document.querySelector('#continueEditing');
      const editorOrigin = 'https://embed.diagrams.net';
      let currentXml = window.JINGXIAOBEI_XML;
      let scale = 1, tx = 0, ty = 0;
      let dragging = false, lastX = 0, lastY = 0;
      let editorLoaded = false, dirty = false, changeVersion = 0;
      let editorTimeout, previewTimeout, toastTimeout, requestId = 0;
      let pending = null;
      let lastGoodPreview = diagram.src;

      function announce(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
      }
      function applyTransform() {
        viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        zoomLabel.textContent = `${Math.round(scale * 100)}%`;
      }
      function fit() {
        if (!diagram.complete || !diagram.naturalWidth) return;
        const width = diagram.naturalWidth;
        const height = diagram.naturalHeight;
        const padding = 36;
        scale = Math.max(0.05, Math.min(3, (stage.clientWidth - padding * 2) / width, (stage.clientHeight - padding * 2) / height));
        tx = (stage.clientWidth - width * scale) / 2;
        ty = (stage.clientHeight - height * scale) / 2;
        applyTransform();
      }
      function zoomAt(next, x = stage.clientWidth / 2, y = stage.clientHeight / 2) {
        next = Math.max(0.05, Math.min(8, next));
        tx = x - (x - tx) * next / scale;
        ty = y - (y - ty) * next / scale;
        scale = next;
        applyTransform();
      }
      function downloadXml(xml) {
        const url = URL.createObjectURL(new Blob([xml], { type: 'application/xml;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = '京小贝权益大卡系统交互.drawio';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        announce('已下载 .drawio');
      }
      function resetEditor() {
        clearTimeout(editorTimeout);
        editorLoaded = false;
        dirty = false;
        changeVersion = 0;
        editor.src = 'about:blank';
      }
      function setBusy(busy) {
        returnButton.disabled = busy;
        downloadButton.disabled = busy || (!editor.hidden && !editorLoaded);
      }
      function failPending(message) {
        clearTimeout(previewTimeout);
        pending = null;
        setBusy(false);
        status.textContent = message;
      }

      diagram.addEventListener('load', () => {
        lastGoodPreview = diagram.src;
        if (!stage.hidden) fit();
        if (pending && pending.phase === 'image') {
          clearTimeout(previewTimeout);
          const completed = pending;
          pending = null;
          currentXml = completed.xml;
          dirty = changeVersion !== completed.changeVersion;
          setBusy(false);
          if (completed.kind === 'apply' && !dirty) {
            resetEditor();
            showPreview('修改已应用到 SVG 预览；如需本地文件请下载 .drawio。');
          } else {
            status.textContent = dirty ? '编辑期间又有修改，请再次应用或下载。' : 'SVG 预览已更新，可继续编辑。';
          }
        }
      });
      diagram.addEventListener('error', () => {
        if (pending) {
          failPending('SVG 预览更新失败，请重试；原有预览仍可查看。');
          if (diagram.src !== lastGoodPreview) diagram.src = lastGoodPreview;
        } else {
          status.textContent = 'SVG 预览加载失败；仍可下载 .drawio。';
        }
      });
      if (diagram.complete && diagram.naturalWidth) fit();
      stage.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        dragging = true;
        lastX = event.clientX; lastY = event.clientY;
        stage.classList.add('dragging');
        stage.setPointerCapture(event.pointerId);
      });
      stage.addEventListener('pointermove', event => {
        if (!dragging) return;
        tx += event.clientX - lastX;
        ty += event.clientY - lastY;
        lastX = event.clientX; lastY = event.clientY;
        applyTransform();
      });
      function endPan(event) {
        dragging = false;
        stage.classList.remove('dragging');
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
      }
      stage.addEventListener('pointerup', endPan);
      stage.addEventListener('pointercancel', endPan);
      stage.addEventListener('wheel', event => {
        event.preventDefault();
        const box = stage.getBoundingClientRect();
        zoomAt(scale * Math.pow(1.0015, -event.deltaY), event.clientX - box.left, event.clientY - box.top);
      }, { passive: false });
      stage.addEventListener('dblclick', fit);
      document.querySelector('#zoomIn').addEventListener('click', () => zoomAt(scale * 1.2));
      document.querySelector('#zoomOut').addEventListener('click', () => zoomAt(scale / 1.2));
      document.querySelector('#fit').addEventListener('click', fit);
      window.addEventListener('resize', () => { if (!stage.hidden) fit(); });

      function showPreview(message = 'SVG 预览已就绪') {
        editor.hidden = true;
        stage.hidden = false;
        notes.hidden = false;
        previewTools.hidden = false;
        returnButton.hidden = true;
        openButton.hidden = false;
        setBusy(false);
        fit();
        status.textContent = message;
      }
      function closeReturnDialog() {
        returnDialog.hidden = true;
      }
      function openReturnDialog() {
        returnDialog.hidden = false;
        applyButton.focus();
      }
      function sendExport(format, xml) {
        const action = { action: 'export', format, requestId: pending.id };
        if (xml) action.xml = xml;
        editor.contentWindow.postMessage(JSON.stringify(action), editorOrigin);
      }
      function armPreviewTimeout() {
        clearTimeout(previewTimeout);
        const id = pending.id;
        previewTimeout = setTimeout(() => {
          if (pending && pending.id === id) failPending('编辑器导出超时，请重试；预览和本地文件尚未同步。');
        }, 20000);
      }
      function beginSvgExport(kind, xml) {
        if (typeof xml !== 'string' || !xml) {
          failPending('未取得有效的图数据，请重试。');
          return;
        }
        pending.xml = xml;
        pending.phase = 'svg';
        if (kind === 'download') downloadXml(xml);
        status.textContent = '正在更新 SVG 预览…';
        sendExport('svg', xml);
        armPreviewTimeout();
      }
      function beginXmlExport(kind) {
        if (pending || !editorLoaded) return;
        pending = { id: ++requestId, kind, phase: 'xml', changeVersion };
        setBusy(true);
        status.textContent = kind === 'apply' ? '正在应用修改…' : '正在获取最新图数据…';
        sendExport('xml');
        armPreviewTimeout();
      }

      openButton.addEventListener('click', () => {
        if (typeof currentXml !== 'string') {
          status.textContent = '图数据未加载，无法打开编辑器。';
          return;
        }
        stage.hidden = true;
        notes.hidden = true;
        editor.hidden = false;
        previewTools.hidden = true;
        openButton.hidden = true;
        returnButton.hidden = false;
        downloadButton.disabled = true;
        status.textContent = '正在连接 draw.io 编辑器…';
        if (!editor.src || editor.src === 'about:blank') {
          editor.src = 'https://embed.diagrams.net/?embed=1&proto=json&spin=1&libraries=1&noSaveBtn=1&saveAndExit=0&noExitBtn=1';
        }
        clearTimeout(editorTimeout);
        editorTimeout = setTimeout(() => { status.textContent = '编辑器未响应；可返回 SVG 预览或下载 .drawio。'; }, 15000);
      });
      returnButton.addEventListener('click', () => {
        if (pending) return;
        if (editorLoaded && dirty) {
          openReturnDialog();
          return;
        }
        resetEditor();
        showPreview();
      });
      continueButton.addEventListener('click', () => { closeReturnDialog(); returnButton.focus(); });
      discardButton.addEventListener('click', () => {
        closeReturnDialog();
        resetEditor();
        showPreview('已放弃本次修改，显示上一版预览。');
      });
      applyButton.addEventListener('click', () => { closeReturnDialog(); beginXmlExport('apply'); });
      returnDialog.addEventListener('click', event => {
        if (event.target === returnDialog) { closeReturnDialog(); returnButton.focus(); }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !returnDialog.hidden) { closeReturnDialog(); returnButton.focus(); }
      });
      downloadButton.addEventListener('click', () => {
        if (editor.hidden) {
          if (typeof currentXml === 'string') downloadXml(currentXml);
          else status.textContent = '图数据未加载，请直接下载原始 .drawio 文件。';
        } else {
          beginXmlExport('download');
        }
      });
      editor.addEventListener('error', () => {
        clearTimeout(editorTimeout);
        status.textContent = '编辑器加载失败；可返回 SVG 预览或下载 .drawio。';
      });
      window.addEventListener('message', event => {
        if (event.origin !== editorOrigin || event.source !== editor.contentWindow) return;
        let message;
        try { message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch { return; }
        if (message.event === 'init') {
          clearTimeout(editorTimeout);
          status.textContent = '正在打开可编辑画布…';
          editor.contentWindow.postMessage(JSON.stringify({
            action: 'load', xml: currentXml, title: '京小贝权益大卡系统交互.drawio', autosave: 1
          }), editorOrigin);
        } else if (message.event === 'load') {
          clearTimeout(editorTimeout);
          editorLoaded = true;
          dirty = false;
          changeVersion = 0;
          setBusy(false);
          status.textContent = '可在画布中编辑；返回预览时可选择应用或放弃修改。';
        } else if (message.event === 'autosave' && editorLoaded && typeof message.xml === 'string') {
          dirty = true;
          changeVersion++;
        } else if (message.event === 'save' && !pending && typeof message.xml === 'string') {
          pending = { id: ++requestId, kind: message.exit ? 'apply' : 'download', phase: 'svg', changeVersion };
          setBusy(true);
          beginSvgExport(pending.kind, message.xml);
        } else if (message.event === 'export' && pending) {
          if (message.message && message.message.requestId !== undefined && message.message.requestId !== pending.id) return;
          if (pending.phase === 'xml' && message.format === 'xml') {
            beginSvgExport(pending.kind, message.xml);
          } else if (pending.phase === 'svg' && message.format === 'svg') {
            if (typeof message.data !== 'string' || !message.data.startsWith('data:image/svg+xml')) {
              failPending('SVG 导出失败，请重试；预览和本地文件尚未同步。');
              return;
            }
            pending.phase = 'image';
            diagram.src = message.data;
          }
        } else if (message.event === 'exit') {
          if (dirty) openReturnDialog();
          else { resetEditor(); showPreview(); }
        }
      });
    })();
  </script>
</body>
</html>
